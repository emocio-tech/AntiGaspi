<aside class="sidebar">
  <div class="brand">
    <span class="logo"><svg lucideCarrot [size]="20"></svg></span>
    <span class="wordmark">antigaspi</span>
  </div>
  <nav>
    <a routerLink="/inventaire" routerLinkActive="active" class="nav-item">
      <svg lucideRefrigerator [size]="18"></svg>
      <span class="label">Inventaire</span>
      @if (inventory.urgentCount() > 0) {
        <span class="urgent" data-testid="urgent-count">{{ inventory.urgentCount() }}</span>
      }
    </a>
    <a routerLink="/profil" routerLinkActive="active" class="nav-item">
      <svg lucideUserRound [size]="18"></svg>
      <span class="label">Profil</span>
    </a>
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <span class="logo small"><svg lucideCarrot [size]="17"></svg></span>
    <span class="wordmark small">antigaspi</span>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
