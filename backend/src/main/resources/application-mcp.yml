# Profil MCP : serveur MCP en Streamable HTTP (endpoint /mcp), local et sans authentification.
# Il n'expose que le tool listerIngredients (voir IngredientMcpConfig).
spring:
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: antigaspi
        version: 0.0.1
# Écoute uniquement en local (profil prévu hors conteneur) : pas d'authentification
server:
  address: 127.0.0.1
