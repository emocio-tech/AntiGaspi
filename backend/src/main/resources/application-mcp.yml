# Profil MCP : serveur MCP en Streamable HTTP (endpoint /mcp), local et sans authentification.
# Il n'expose que les tools de l'inventaire : listerIngredients, ajouterIngredients, supprimerIngredients et
# modifierIngredients (voir IngredientMcpConfig). Les trois derniers modifient la base MySQL.
spring:
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: antigaspi
        version: 0.0.1
# Écoute uniquement en local (profil prévu hors conteneur) : pas d'authentification
server:
  address: 127.0.0.1
